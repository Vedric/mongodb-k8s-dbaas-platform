---
name: Go modules

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: Build, test and vet (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [api/gateway, cdc/consumer]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: "off"
      GOMAXPROCS: "2"
      GOFLAGS: "-mod=readonly -p=2"
      KUBECONFIG: /dev/null
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Download and verify the committed module graph
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Compile the deployed binary without C dependencies
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/module-binary" .
      - name: Static checks
        run: go vet ./...
      - name: Isolated handler and event tests with the race detector
        run: go test -race -count=1 -timeout=60s ./...
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Require reproducible module files
        run: git diff --exit-code -- go.mod go.sum
